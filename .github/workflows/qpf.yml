name: La Plata WPC QPF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qpf_monitor.py'
      - 'nbm_monitor.py'
      - 'groupme_notify.py'
      - 'rrfs_image.py'
      - 'scripts/render_rrfs_comparison.py'
      - 'assets/rrfs/**'
      - 'local_rain_monitor.py'
      - 'operational_monitor.py'
      - 'snow_monitor.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/qpf.yml'
      - '.chatgpt-trigger'
permissions:
  contents: write
concurrency:
  group: la-plata-qpf
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check RRFS image upload configuration
        id: rrfs_auth
        continue-on-error: true
        env:
          GROUPME_ACCESS_TOKEN: ${{ secrets.GROUPME_ACCESS_TOKEN }}
        run: |
          python - <<'PYCODE'
          import os, sys
          if not os.environ.get('GROUPME_ACCESS_TOKEN'):
              print('::warning::Add the GROUPME_ACCESS_TOKEN Actions secret to enable RRFS image uploads. Existing text delivery is unchanged.')
              sys.exit(1)
          print('GroupMe image upload token is configured.')
          PYCODE
      - name: Verify calculations
        run: python -m pytest -q
      - name: Snapshot prior verified forecast
        run: |
          mkdir -p data
          git show HEAD:data/latest.json > data/previous.json 2>/dev/null || rm -f data/previous.json
      - name: Query live WPC and county boundary
        run: python qpf_monitor.py
      - name: Analyze NOAA snowfall probabilities
        run: python snow_monitor.py
      - name: Render latest RRFS comparison image
        id: rrfs_render
        continue-on-error: true
        run: python rrfs_image.py render
      - name: Save validated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest.md
          if ! git diff --staged --quiet; then
            git commit -m "Refresh verified WPC county forecast"
            git push
          fi
      - name: Notify GroupMe on rainfall, river, flood or timing changes
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Trigger scheduled QPF check') }}
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
        run: python groupme_notify.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Persist notification status after successful delivery
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Trigger scheduled QPF check') }}
        run: |
          git add data/notification_state.json data/operational_latest.json
          if ! git diff --staged --quiet; then
            git commit -m "Save GroupMe notification state"
            git push
          fi
      - name: Send RRFS image to the QPF GroupMe
        id: rrfs_send
        if: ${{ !cancelled() && steps.rrfs_render.outcome == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Trigger scheduled QPF check')) }}
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          GROUPME_ACCESS_TOKEN: ${{ secrets.GROUPME_ACCESS_TOKEN }}
        run: python rrfs_image.py send ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Persist successful RRFS image delivery
        if: ${{ !cancelled() && steps.rrfs_send.outcome == 'success' }}
        run: |
          if [ -f data/rrfs_image_state.json ]; then
            git add data/rrfs_image_state.json
            if ! git diff --staged --quiet; then
              git commit -m "Save RRFS image delivery state"
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: qpf-output
          path: data/


