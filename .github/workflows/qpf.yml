name: La Plata WPC QPF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qpf_monitor.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/qpf.yml'
  schedule:
    - cron: '20 1,13 * * *'
permissions:
  contents: write
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify calculations
        run: python -m pytest -q
      - name: Query live WPC and county boundary
        run: python qpf_monitor.py
      - name: Save validated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest.md
          if ! git diff --staged --quiet; then
            git commit -m "Refresh verified WPC county forecast"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: qpf-output
          path: data/
