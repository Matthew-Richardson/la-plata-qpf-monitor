name: Post current RRFS image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.rrfs-image-trigger']
permissions:
  contents: write
concurrency:
  group: la-plata-qpf
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render newest available RRFS image
        run: python rrfs_image.py render
      - name: Post image to QPF GroupMe
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          GROUPME_ACCESS_TOKEN: ${{ secrets.GROUPME_ACCESS_TOKEN }}
        run: python rrfs_image.py send --force
      - name: Save successful delivery state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rrfs_image_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Save manual RRFS image delivery state"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: current-rrfs-image
          path: data/rrfs-map/
